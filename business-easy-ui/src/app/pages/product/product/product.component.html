<app-search-options panelTitle="Search Product">
  <form (ngSubmit)="searchProduct()" #fr="ngForm">
    <div class="form-row">
      <div class="form-group col-md-6 col-lg-4 col-xl-3">
        <label for="name">Name</label>
        <input
          type="text"
          class="form-control form-control-sm"
          name="name"
          id="name"
          maxlength="30"
          placeholder="Enter product name.."
          [(ngModel)]="searchOptions.name"
        />
      </div>
      <div class="form-group col-md-6 col-lg-4 col-xl-3">
        <label for="type">Type</label>
        <input
          type="text"
          class="form-control form-control-sm"
          name="type"
          id="type"
          maxlength="30"
          placeholder="Enter product type.."
          [(ngModel)]="searchOptions.type"
        />
      </div>
      <div class="form-group col-md-6 col-lg-4 col-xl-3">
        <label for="brand">Brand</label>
        <input
          type="text"
          class="form-control form-control-sm"
          name="brand"
          id="brand"
          maxlength="30"
          placeholder="Enter product brand.."
          [(ngModel)]="searchOptions.brand"
        />
      </div>
    </div>

    <hr />

    <div class="row justify-content-end">
      <button
        type="submit"
        class="btn btn-primary mx-1 btn-sm"
        [disabled]="!fr.valid"
      >
        Search
      </button>
      <button class="btn btn-secondary ml-1 mr-3 btn-sm" (click)="resetForm()">
        Reset
      </button>
    </div>
  </form>
</app-search-options>
<br />
<div class="shadow bg-white">
  <div
    class="d-flex bg-white align-items-baseline justify-content-end"
    role="group"
  >
    <button
      type="button"
      class="btn btn-outline-primary mx-1"
      ngbTooltip="Add Product"
      (click)="openProductModal(productModal, false)"
    >
      <i class="fa fa-plus"></i>
    </button>
    <button
      type="button"
      class="btn btn-outline-lightning"
      ngbTooltip="Download Report"
      placement="left"
      (click)="downloadAsReport()"
    >
      <i class="fa fa-download" aria-hidden="true"></i>
    </button>
  </div>
  <ngx-datatable
    class="material"
    [rows]="productPage.content"
    [columns]="columns"
    [columnMode]="columnMode.force"
    footerHeight="auto"
    headerHeight="auto"
    rowHeight="auto"
    [externalPaging]="true"
    [count]="productPage.totalElements"
    [offset]="productPage.number"
    [limit]="productPage.size"
    (activate)="onActivate($event)"
    (page)="changePage($event)"
  >
    <ngx-datatable-column name="Options" maxWidth="100" minWidth="80">
      <ng-template ngx-datatable-cell-template>
        <button
          class="btn btn-outline-lightning"
          (click)="openProductModal(productModal, true)"
        >
          <i class="fa fa-edit"></i>
        </button>
      </ng-template>
    </ngx-datatable-column>
    <ngx-datatable-column
      *ngFor="let column of columns"
      [name]="column.name"
    ></ngx-datatable-column>
  </ngx-datatable>
</div>

<!-- <ngx-spinner> </ngx-spinner> -->

<ng-template #productModal let-modal>
  <div class="modal-header">
    <h4 class="modal-title">
      {{ updateMode ? "Update Product" : "Add Product" }}
    </h4>
    <button
      type="button"
      class="close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body">
    <form [formGroup]="productForm">
      <div class="form-group">
        <label for="name">Name <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          id="name"
          formControlName="name"
        />
        <span class="text-monospace text-danger">
          {{ util.getValidationError(productForm, "name") }}
        </span>
      </div>
      <div class="form-group">
        <label for="type">Type</label>
        <input
          type="text"
          class="form-control"
          id="type"
          formControlName="type"
        />
        <span class="text-monospace text-danger">
          {{ util.getValidationError(productForm, "type") }}
        </span>
      </div>
      <div class="form-group">
        <label for="brand">Brand</label>
        <input
          type="text"
          class="form-control"
          id="brand"
          formControlName="brand"
        />
        <span class="text-monospace text-danger">
          {{ util.getValidationError(productForm, "brand") }}
        </span>
      </div>
      <div class="form-group">
        <label for="country">Country <span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          id="country"
          formControlName="country"
        />
        <span class="text-monospace text-danger">
          {{ util.getValidationError(productForm, "country") }}
        </span>
      </div>
      <div class="form-group">
        <label for="size">Size</label>
        <div class="input-group">
          <input
            #sizeInput
            type="text"
            class="form-control"
            id="size"
            name="size"
            formControlName="size"
          />
          <div *ngIf="!updateMode" class="input-group-append">
            <button
              class="btn btn-outline-success"
              (click)="addProductSize(sizeInput)"
            >
              <i class="fa fa-plus"></i>
            </button>
          </div>
        </div>
      </div>
      <div *ngIf="!updateMode" class="d-flex flex-wrap">
        <button
          disabled
          *ngFor="let size of newProductSizes"
          class="btn btn-outline-primary m-1 product-size-token"
        >
          <span #sizeToken>{{ size }} </span>
          <i
            class="fa fa-times-circle"
            (click)="removeProductSize(sizeToken)"
          ></i>
        </button>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-primary"
      (click)="addOrUpdateProduct()"
    >
      {{ updateMode ? "Update" : "Add" }}
    </button>
    <button
      type="button"
      class="btn btn-secondary"
      (click)="closeProductModal()"
    >
      Close
    </button>
  </div>
</ng-template>
