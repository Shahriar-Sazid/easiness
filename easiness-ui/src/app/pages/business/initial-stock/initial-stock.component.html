<div class="container-fluid">
    <app-page-title title="Buy Product"></app-page-title>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <aw-wizard [navBarLayout]="'large-empty'">


                        <aw-wizard-step stepTitle="Product Selection">
                            <ng-template awWizardStepSymbol>
                                <i class="fas fa-wrench fa-lg"></i>
                            </ng-template>
                            <div class="card">
                                <div class="card-body">

                                    <app-product [viewMode]="'buy'"
                                        (productSelected)="costingModal.openCostingModal($event)">
                                    </app-product>

                                </div>
                            </div>
                            <ul class="list-inline wizard mb-0">
                                <li class="next list-inline-item float-end">
                                    <button class="btn btn-primary" awNextStep>Next</button>
                                </li>
                            </ul>
                        </aw-wizard-step>

                        <aw-wizard-step stepTitle="Stock Information">
                            <ng-template awWizardStepSymbol>
                                <i class="fas fa-file-invoice fa-lg"></i>
                            </ng-template>

                            <app-document [mode]="purchase.type" #doc [document]="purchase"></app-document>
                            <br>
                            <ul class="list-inline wizard mb-0">
                                <ul class="list-inline wizard mb-0">
                                    <li class="previous list-inline-item">
                                        <button class="btn btn-secondary" awPreviousStep>
                                            Previous
                                        </button>
                                    </li>
                                    <li class="next list-inline-item float-end">
                                        <button class="btn btn-primary" awNextStep [disabled]="!doc.isValid()"
                                            (click)="addToStock()">Add To
                                            Stock</button>
                                    </li>
                                </ul>
                            </ul>
                        </aw-wizard-step>
                    </aw-wizard>
                </div>
            </div>
        </div>
    </div>
</div>



<app-costing [mode]="'buy'" [defaultPlace]="defaultPlace" #costingModal (add)="addToPurchaseList($event)">
</app-costing>
