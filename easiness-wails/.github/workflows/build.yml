name: Build & Release

on:
  push:
    tags:
      - 'v*'          # triggers on version tags like v1.0.0
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: write      # needed to create GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows ───────────────────────────────────────────────────────
          - os: windows-latest
            platform: windows/amd64
            artifact: easiness-windows-amd64.exe
            build_cmd: wails build -production -platform windows/amd64 -nsis
            binary: build/bin/easiness-amd64-installer.exe

          # ── macOS Intel ───────────────────────────────────────────────────
          - os: macos-13          # Intel runner
            platform: darwin/amd64
            artifact: easiness-darwin-amd64.dmg
            build_cmd: wails build -production -platform darwin/amd64
            binary: build/bin/easiness.app.zip

          # ── macOS Apple Silicon ───────────────────────────────────────────
          - os: macos-14          # Apple M1 runner
            platform: darwin/arm64
            artifact: easiness-darwin-arm64.dmg
            build_cmd: wails build -production -platform darwin/arm64
            binary: build/bin/easiness.app.zip

          # ── Linux x86_64 ──────────────────────────────────────────────────
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: easiness-linux-amd64
            build_cmd: wails build -production -platform linux/amd64
            binary: build/bin/easiness

    runs-on: ${{ matrix.os }}

    steps:
      # ── Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Go ──────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # ── Node ────────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Wails CLI ───────────────────────────────────────────────────────
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # ── Windows: CGo (GCC via MSYS2, already on GitHub Actions) ─────────
      - name: Windows — verify GCC
        if: runner.os == 'Windows'
        shell: pwsh
        run: gcc --version

      # ── macOS: Xcode tools (pre-installed on macOS runners) ─────────────
      - name: macOS — verify Xcode tools
        if: runner.os == 'macOS'
        run: xcode-select -p

      # ── Linux: system dependencies ──────────────────────────────────────
      - name: Linux — install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            gcc \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            nsis \
            libglib2.0-dev

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build
        working-directory: easiness-wails
        run: ${{ matrix.build_cmd }}

      # ── macOS: package as DMG ────────────────────────────────────────────
      - name: macOS — create DMG
        if: runner.os == 'macOS'
        working-directory: easiness-wails
        run: |
          brew install create-dmg || true
          create-dmg \
            --volname "Easiness" \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "easiness.app" 175 190 \
            --app-drop-link 425 190 \
            "build/bin/${{ matrix.artifact }}" \
            "build/bin/easiness.app" || \
          hdiutil create -volname "Easiness" -srcfolder "build/bin/easiness.app" \
            -ov -format UDZO "build/bin/${{ matrix.artifact }}"

      # ── Linux: rename binary ─────────────────────────────────────────────
      - name: Linux — rename binary
        if: runner.os == 'Linux'
        working-directory: easiness-wails
        run: mv build/bin/easiness build/bin/${{ matrix.artifact }}

      # ── Upload artifact ──────────────────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: easiness-wails/build/bin/${{ matrix.artifact }}
          if-no-files-found: error

  # ── Create GitHub Release ────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
