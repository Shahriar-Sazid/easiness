<app-invoice-header [purchase]="purchase"></app-invoice-header>
<br>
<app-invoice-item-header></app-invoice-item-header>
<div *ngFor="let item of purchase.items; let i = index">
  <app-invoice-item [placeRecord]="placeService.placeRecord" [item]="item" [index]="i" (onCancel)="cancelItem($event)">
  </app-invoice-item>
  <hr class="m-0 bg-primary">
</div>
<app-invoice-item-footer [purchase]="purchase"></app-invoice-item-footer>
